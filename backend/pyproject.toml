[project]
name = "hw2-workbench"
version = "0.1.0"
description = "代码审查工作台：父 Agent 管理的代码审查与修复"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# E and F catch real bugs. Line length and module-import style are left alone
# so this branch does not reformat the tree.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
check_untyped_defs = false
follow_imports = "silent"
disable_error_code = ["import-untyped"]

# Modules this branch did not meaningfully change. The files edited here
# (task_service, patches, background, workspace preview, execution_locks,
# controller, recovery, database, and the new API helpers) stay checked.
[[tool.mypy.overrides]]
module = [
    "app.workflow.nodes",
    "app.workflow.builder",
    "app.workflow.runner",
    "app.workflow.state",
    "app.workflow.adapter",
    "app.workflow.detection",
    "app.workflow.reducers",
    "app.services.tools.checks",
    "app.services.tools.test_executor",
    "app.services.tools.sandbox",
    "app.services.tools.static_rules",
    "app.services.tools.filesystem",
    "app.services.tools.artifacts_tools",
    "app.services.tools.outputs",
    "app.services.tools.check_scope",
    "app.services.tools.common",
    "app.services.tools",
]
ignore_errors = true
